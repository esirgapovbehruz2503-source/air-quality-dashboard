name: Scheduled Assessed Collection

on:
  schedule:
    - cron: '2 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run assessed collector
        run: python -m src.collector --mode assessed

      - name: Commit updated assessed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/assessed/
          if ! git diff --cached --quiet; then
            git commit -m "Automated assessed collection run"
            git push
          fi